
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON STREET RACING 3D</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    overflow: hidden;
    background: #050510;
    color: white;
    font-family: Arial, sans-serif;
}

#game {
    position: fixed;
    inset: 0;
}

canvas {
    display: block;
}

#hud {
    position: fixed;
    top: 15px;
    left: 15px;
    right: 15px;
    display: flex;
    justify-content: space-between;
    gap: 10px;
    pointer-events: none;
    z-index: 3;
}

.panel {
    background: rgba(0,0,0,.7);
    border: 1px solid #00eaff;
    border-radius: 10px;
    padding: 12px 16px;
    box-shadow: 0 0 12px #00eaff55;
}

.stat {
    font-size: 13px;
    color: #aaa;
}

.value {
    font-size: 23px;
    color: #00ffff;
    font-weight: bold;
}

#nitroBox {
    position: fixed;
    top: 100px;
    left: 15px;
    width: 160px;
    z-index: 3;
}

#nitroBar {
    height: 10px;
    background: #222;
    border-radius: 10px;
    overflow: hidden;
    margin-top: 6px;
}

#nitroFill {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, #00eaff, #a000ff);
}

#menu {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.78);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 5;
    text-align: center;
    padding: 20px;
}

#menuContent {
    max-width: 480px;
    width: 100%;
    background: #101020;
    border: 2px solid #00eaff;
    border-radius: 18px;
    padding: 30px 20px;
    box-shadow: 0 0 35px #00eaff66;
}

h1 {
    color: #00eaff;
    text-shadow: 0 0 15px #00eaff;
    font-size: 30px;
}

button {
    cursor: pointer;
    border: none;
    border-radius: 9px;
    padding: 14px 22px;
    font-weight: bold;
    font-size: 15px;
}

#startBtn {
    background: #00eaff;
    color: black;
    margin-top: 15px;
}

#controls {
    position: fixed;
    bottom: 25px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    padding: 0 25px;
    z-index: 4;
    pointer-events: none;
}

.controlBtn {
    pointer-events: auto;
    width: 65px;
    height: 65px;
    border-radius: 50%;
    background: #101020dd;
    color: #00eaff;
    border: 2px solid #00eaff;
    font-size: 25px;
    touch-action: none;
}

#nitroBtn {
    width: 85px;
    height: 55px;
    border-radius: 12px;
    background: #6410a0dd;
    color: white;
    border: 2px solid #d000ff;
    font-size: 13px;
}

#hint {
    color: #aaa;
    font-size: 13px;
    line-height: 1.8;
}

@media (max-width: 600px) {
    h1 { font-size: 23px; }
    .panel { padding: 8px; }
    .value { font-size: 18px; }
}
</style>
</head>

<body>

<div id="game"></div>

<div id="hud">
    <div class="panel">
        <div class="stat">SCORE</div>
        <div class="value" id="score">0</div>
    </div>
    <div class="panel">
        <div class="stat">SPEED</div>
        <div class="value"><span id="speed">0</span> KM/H</div>
    </div>
    <div class="panel">
        <div class="stat">BEST</div>
        <div class="value" id="best">0</div>
    </div>
</div>

<div id="nitroBox" class="panel">
    <div class="stat">⚡ NITRO</div>
    <div id="nitroBar"><div id="nitroFill"></div></div>
</div>

<div id="menu">
    <div id="menuContent">
        <h1>🏎 NEON STREET RACING</h1>
        <p>3D HIGH SPEED RACING</p>
        <p id="menuMessage">Avoid the traffic and beat your record!</p>
        <button id="startBtn" onclick="startGame()">START RACING</button>
        <p id="hint">
            PC: Arrow keys or A / D to move<br>
            SPACE: Nitro
        </p>
    </div>
</div>

<div id="controls">
    <div>
        <button class="controlBtn" id="leftBtn">◀</button>
        <button class="controlBtn" id="rightBtn">▶</button>
    </div>
    <button id="nitroBtn">⚡ NITRO</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
const container = document.getElementById("game");

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050510);
scene.fog = new THREE.Fog(0x050510, 30, 180);

const camera = new THREE.PerspectiveCamera(
    65, window.innerWidth / window.innerHeight, 0.1, 300
);
camera.position.set(0, 8, 15);
camera.lookAt(0, 0, -15);

const renderer = new THREE.WebGLRenderer({
    antialias: true
});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

// LIGHTS
scene.add(new THREE.HemisphereLight(0xffffff, 0x202040, 1.5));

const light = new THREE.DirectionalLight(0xffffff, 1.5);
light.position.set(5, 15, 8);
scene.add(light);

// MATERIALS
const roadMat = new THREE.MeshStandardMaterial({
    color: 0x171722,
    roughness: 0.8
});

const greenMat = new THREE.MeshStandardMaterial({
    color: 0x00eaff,
    emissive: 0x004455
});

const whiteMat = new THREE.MeshStandardMaterial({
    color: 0xffffff,
    emissive: 0x222222
});

// ROAD
const road = new THREE.Mesh(
    new THREE.PlaneGeometry(14, 220),
    roadMat
);
road.rotation.x = -Math.PI / 2;
road.position.z = -80;
scene.add(road);

// ROAD EDGES
for (let x of [-7.2, 7.2]) {
    const edge = new THREE.Mesh(
        new THREE.BoxGeometry(.15, .08, 220),
        greenMat
    );
    edge.position.set(x, .05, -80);
    scene.add(edge);
}

// ROAD LINES
let roadLines = [];

for (let z = -180; z < 20; z += 10) {
    for (let x of [-2.3, 2.3]) {
        const line = new THREE.Mesh(
            new THREE.BoxGeometry(.12, .04, 4),
            whiteMat
        );
        line.position.set(x, .04, z);
        scene.add(line);
        roadLines.push(line);
    }
}

// PLAYER CAR
const car = new THREE.Group();

const carBody = new THREE.Mesh(
    new THREE.BoxGeometry(1.8, .65, 3.4),
    new THREE.MeshStandardMaterial({
        color: 0x00bfff,
        metalness: .7,
        roughness: .25
    })
);
carBody.position.y = .75;
car.add(carBody);

const cabin = new THREE.Mesh(
    new THREE.BoxGeometry(1.35, .7, 1.5),
    new THREE.MeshStandardMaterial({
        color: 0x101c33,
        metalness: .6,
        roughness: .2
    })
);
cabin.position.set(0, 1.35, -.25);
car.add(cabin);

// WINDSHIELD
const windshield = new THREE.Mesh(
    new THREE.BoxGeometry(1.25, .5, .08),
    new THREE.MeshStandardMaterial({
        color: 0x44ccff,
        metalness: .5,
        roughness: .1
    })
);
windshield.position.set(0, 1.4, -.99);
car.add(windshield);

// WHEELS
const wheelMat = new THREE.MeshStandardMaterial({
    color: 0x080808
});

for (let x of [-.95, .95]) {
    for (let z of [-1.05, 1.05]) {
        const wheel = new THREE.Mesh(
            new THREE.CylinderGeometry(.4, .4, .25, 20),
            wheelMat
        );
        wheel.rotation.z = Math.PI / 2;
        wheel.position.set(x, .4, z);
        car.add(wheel);
    }
}

// HEADLIGHTS
for (let x of [-.6, .6]) {
    const lamp = new THREE.Mesh(
        new THREE.BoxGeometry(.35, .15, .08),
        new THREE.MeshBasicMaterial({color: 0xffffff})
    );
    lamp.position.set(x, .75, -1.73);
    car.add(lamp);
}

car.position.set(0, 0, 5);
scene.add(car);

// TREES / CITY LIGHTS
let decorations = [];

for (let z = -180; z < 20; z += 12) {
    for (let side of [-1, 1]) {
        const building = new THREE.Mesh(
            new THREE.BoxGeometry(
                2 + Math.random() * 3,
                4 + Math.random() * 13,
                3 + Math.random() * 3
            ),
            new THREE.MeshStandardMaterial({
                color: 0x11152b,
                emissive: 0x080a25
            })
        );

        building.position.set(
            side * (11 + Math.random() * 8),
            building.geometry.parameters.height / 2,
            z
        );

        scene.add(building);
        decorations.push(building);

        const lamp = new THREE.PointLight(
            side === 1 ? 0x00ccff : 0xff00aa,
            .7, 15
        );
        lamp.position.set(side * 9, 3, z);
        scene.add(lamp);
    }
}

// ENEMY CARS
let enemies = [];

function createEnemy() {
    const enemy = new THREE.Group();

    const color = [
        0xff2222, 0xffaa00, 0xaa33ff, 0xffffff
    ][Math.floor(Math.random() * 4)];

    const body = new THREE.Mesh(
        new THREE.BoxGeometry(1.8, .8, 3.2),
        new THREE.MeshStandardMaterial({
            color: color,
            metalness: .5,
            roughness: .3
        })
    );
    body.position.y = .7;
    enemy.add(body);

    const top = new THREE.Mesh(
        new THREE.BoxGeometry(1.3, .6, 1.4),
        new THREE.MeshStandardMaterial({
            color: 0x111827,
            metalness: .4
        })
    );
    top.position.set(0, 1.35, 0);
    enemy.add(top);

    const lane = [-4.5, 0, 4.5][
        Math.floor(Math.random() * 3)
    ];

    enemy.position.set(lane, 0, -100);
    scene.add(enemy);
    enemies.push(enemy);
}

// GAME VARIABLES
let running = false;
let score = 0;
let speed = 0;
let nitro = 100;
let nitroActive = false;
let spawnTimer = 0;
let enemySpeed = 0.55;
let playerX = 0;

let best = Number(localStorage.getItem("neonBest") || 0);
document.getElementById("best").innerText = best;

// CONTROLS
const keys = {};

window.addEventListener("keydown", e => {
    keys[e.key.toLowerCase()] = true;

    if (e.code === "Space") {
        e.preventDefault();
        nitroActive = true;
    }
});

window.addEventListener("keyup", e => {
    keys[e.key.toLowerCase()] = false;

    if (e.code === "Space") nitroActive = false;
});

function holdButton(id, key) {
    const button = document.getElementById(id);

    button.addEventListener("pointerdown", e => {
        e.preventDefault();
        keys[key] = true;
    });

    ["pointerup", "pointerleave", "pointercancel"].forEach(event => {
        button.addEventListener(event, () => {
            keys[key] = false;
        });
    });
}

holdButton("leftBtn", "arrowleft");
holdButton("rightBtn", "arrowright");
holdButton("nitroBtn", "nitro");

document.getElementById("nitroBtn").addEventListener(
    "pointerdown", () => nitroActive = true
);
document.getElementById("nitroBtn").addEventListener(
    "pointerup", () => nitroActive = false
);
document.getElementById("nitroBtn").addEventListener(
    "pointerleave", () => nitroActive = false
);

// START GAME
function startGame() {
    score = 0;
    speed = 0;
    nitro = 100;
    playerX = 0;
    spawnTimer = 0;
    enemySpeed = .55;

    enemies.forEach(e => scene.remove(e));
    enemies = [];

    car.position.x = 0;

    document.getElementById("score").innerText = "0";
    document.getElementById("menu").style.display = "none";

    running = true;
}

// GAME OVER
function gameOver() {
    running = false;

    if (score > best) {
        best = score;
        localStorage.setItem("neonBest", best);
        document.getElementById("best").innerText = best;
    }

    document.getElementById("menu").style.display = "flex";
    document.getElementById("menuContent").querySelector("h1").innerText =
        "💥 GAME OVER";

    document.getElementById("menuMessage").innerText =
        "Your score: " + score + " | Best: " + best;

    document.getElementById("startBtn").innerText = "RACE AGAIN";
}

// MAIN LOOP
let lastTime = 0;

function animate(time) {
    requestAnimationFrame(animate);

    let delta = Math.min((time - lastTime) / 16.67, 2);
    lastTime = time;

    if (running) {
        const movingLeft =
            keys["arrowleft"] || keys["a"];

        const movingRight =
            keys["arrowright"] || keys["d"];

        if (movingLeft) playerX -= .16 * delta;
        if (movingRight) playerX += .16 * delta;

        playerX = THREE.MathUtils.clamp(playerX, -5.2, 5.2);

        car.position.x += (playerX - car.position.x) * .2;

        const usingNitro =
            (nitroActive || keys["nitro"] || keys[" "]) &&
            nitro > 0;

        if (usingNitro) {
            nitro = Math.max(0, nitro - .7 * delta);
        } else {
            nitro = Math.min(100, nitro + .15 * delta);
        }

        speed = usingNitro ? 260 : 170 + score / 30;
        enemySpeed = usingNitro ? .95 : .58;

        document.getElementById("speed").innerText =
            Math.floor(speed);

        document.getElementById("nitroFill").style.width =
            nitro + "%";

        // ROAD MOVEMENT
        roadLines.forEach(line => {
            line.position.z += enemySpeed * delta * 2;

            if (line.position.z > 15) {
                line.position.z -= 200;
            }
        });

        decorations.forEach(item => {
            item.position.z += enemySpeed * delta * 2;

            if (item.position.z > 20) {
                item.position.z -= 200;
            }
        });

        // SPAWN ENEMIES
        spawnTimer += delta;

        if (spawnTimer > 55) {
            createEnemy();
            spawnTimer = 0;
        }

        // MOVE ENEMIES AND CHECK COLLISIONS
        for (let i = enemies.length - 1; i >= 0; i--) {
            let e = enemies[i];

            e.position.z += enemySpeed * delta * 2;

            if (
                Math.abs(e.position.z - car.position.z) < 2.4 &&
                Math.abs(e.position.x - car.position.x) < 1.5
            ) {
                gameOver();
                break;
            }

            if (e.position.z > 18) {
                scene.remove(e);
                enemies.splice(i, 1);
                score += 10;
                document.getElementById("score").innerText = score;
            }
        }

        // CAR MOVEMENT EFFECT
        car.rotation.z = (car.position.x - playerX) * -.05;
        car.position.y = Math.sin(time * .01) * .025;
    }

    renderer.render(scene, camera);
}

requestAnimationFrame(animate);

// RESIZE
window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
